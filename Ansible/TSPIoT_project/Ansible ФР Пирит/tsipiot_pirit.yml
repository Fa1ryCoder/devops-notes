---
- name: Установка ТС ПИоТ для ФР Пирит
  hosts: cashregisters
  become: yes

  vars:
    allowed_pos_versions:
      - "4.6.304-10"
      - "5.304.10"
    deb_src_dir: "/opt/tsipiot/packages"
    esm_conf_dest: "/linuxcash/cash/conf/ncash.ini.d/puppet/~esmmanager.ini"
    crpt_ini_primary: "/linuxcash/cash/conf/ncash.ini.d/puppet/crpt.ini"
    crpt_ini_fallback: "/linuxcash/cash/conf/ncash.ini.d/crpt.ini"
    regime_version: "2.1.0-619"

  tasks:

    # ─────────────────────────────────────────────────────────────
    # БЛОК 1: Определение типа кассы и проверка версии
    # ─────────────────────────────────────────────────────────────

    - name: Получить список установленных пакетов
      package_facts:
        manager: apt

    - name: Определить тип кассы (РМК)
      set_fact:
        cash_type: "rmk"
        cash_version: "{{ ansible_facts.packages['artix-pos'][0].version }}"
      when: "'artix-pos' in ansible_facts.packages"

    - name: Определить тип кассы (КСО)
      set_fact:
        cash_type: "sco"
        cash_version: "{{ ansible_facts.packages['artix-sst-sco'][0].version }}"
      when:
        - "'artix-sst-sco' in ansible_facts.packages"
        - cash_type is not defined

    - name: Пропустить кассу — тип не определён
      block:
        - debug:
            msg: "ПРОПУСК {{ inventory_hostname }}: пакет artix-pos/artix-sst-sco не найден"
        - meta: end_host
      when: cash_type is not defined

    - name: Пропустить кассу — версия не подходит
      block:
        - debug:
            msg: "ПРОПУСК {{ inventory_hostname }}: версия {{ cash_version }} не входит в список допустимых {{ allowed_pos_versions }}"
        - meta: end_host
      when: cash_version not in allowed_pos_versions

    - name: Касса прошла проверку версии
      debug:
        msg: "{{ inventory_hostname }}: тип={{ cash_type }}, версия={{ cash_version }} — продолжаем"

    # ─────────────────────────────────────────────────────────────
    # БЛОК 2: Обновление artix-comproxy
    # ─────────────────────────────────────────────────────────────

    - name: Обновить artix-comproxy через aptitude
      command: aptitude install -y artix-comproxy
      register: comproxy_install
      changed_when: "'artix-comproxy' in comproxy_install.stdout"

    - name: Получить версию artix-comproxy
      command: dpkg-query -W -f='${Version}' artix-comproxy
      register: comproxy_version
      changed_when: false

    - name: Пропустить кассу — artix-comproxy ниже 1.15-62
      block:
        - debug:
            msg: "ПРОПУСК {{ inventory_hostname }}: artix-comproxy версии {{ comproxy_version.stdout }} ниже требуемой 1.15-62"
        - meta: end_host
      when: comproxy_version.stdout is version('1.15-62', '<')

    # ─────────────────────────────────────────────────────────────
    # БЛОК 3: Поиск и чтение crpt.ini
    # ─────────────────────────────────────────────────────────────

    - name: Проверить наличие crpt.ini (основной путь)
      stat:
        path: "{{ crpt_ini_primary }}"
      register: crpt_primary_stat

    - name: Проверить наличие crpt.ini (запасной путь)
      stat:
        path: "{{ crpt_ini_fallback }}"
      register: crpt_fallback_stat
      when: not crpt_primary_stat.stat.exists

    - name: Определить итоговый путь к crpt.ini
      set_fact:
        crpt_ini_path: >-
          {{ crpt_ini_primary if crpt_primary_stat.stat.exists else
             crpt_ini_fallback if crpt_fallback_stat.stat is defined and crpt_fallback_stat.stat.exists else
             '' }}

    - name: Прочитать crpt.ini
      slurp:
        src: "{{ crpt_ini_path }}"
      register: crpt_ini_raw
      when: crpt_ini_path | length > 0

    - name: Распарсить значения из crpt.ini
      set_fact:
        lmchz_url:      "{{ (crpt_ini_raw.content | b64decode | regex_search('(?m)^url\\s*=\\s*(.+)$', '\\1')) | first | trim }}"
        lmchz_user:     "{{ (crpt_ini_raw.content | b64decode | regex_search('(?m)^user\\s*=\\s*(.+)$', '\\1')) | first | trim }}"
        lmchz_password: "{{ (crpt_ini_raw.content | b64decode | regex_search('(?m)^password\\s*=\\s*(.+)$', '\\1')) | first | trim }}"
      when: crpt_ini_path | length > 0

    - name: Вытащить IP из URL
      set_fact:
        lmchz_address: "{{ lmchz_url | regex_replace('^https?://([^:/]+)(:\\d+)?.*$', '\\1') }}"
      when:
        - lmchz_url is defined
        - lmchz_url | length > 0

    # ─────────────────────────────────────────────────────────────
    # БЛОК 4: Установка пакетов (логика зависит от адреса)
    # ─────────────────────────────────────────────────────────────

    # --- Сценарий A: адрес 127.0.0.1 ---

    - name: "[127.0.0.1] Установить esm + esm-lm-controller + esm-csi-dkkt"
      command: >
        apt install -y
        {{ deb_src_dir }}/esm_1.6.2.0_amd64.deb
        {{ deb_src_dir }}/esm-lm-controller_1.6.2.1_amd64.deb
        {{ deb_src_dir }}/esm-csi-dkkt_1.0.1_all.deb
      when: lmchz_address is defined and lmchz_address == '127.0.0.1'

    - name: "[127.0.0.1] Проверить установлен ли regime"
      set_fact:
        regime_installed_version: "{{ ansible_facts.packages['regime'][0].version | default('') }}"
      when: lmchz_address is defined and lmchz_address == '127.0.0.1'

    - name: "[127.0.0.1] Установить/переустановить regime {{ regime_version }}"
      shell: |
        echo -e "admin\nadmin\n\n\n" | apt install -y regime={{ regime_version }}
      when:
        - lmchz_address is defined and lmchz_address == '127.0.0.1'
        - regime_installed_version | default('') != regime_version

    # --- Сценарий B: адрес отличный от 127.0.0.1 или crpt.ini нет ---

    - name: "[внешний адрес] Установить esm + esm-csi-dkkt"
      command: >
        apt install -y
        {{ deb_src_dir }}/esm_1.6.2.0_amd64.deb
        {{ deb_src_dir }}/esm-csi-dkkt_1.0.1_all.deb
      when: >
        lmchz_address is not defined or
        lmchz_address != '127.0.0.1'

    # ─────────────────────────────────────────────────────────────
    # БЛОК 5: Сертификаты
    # ─────────────────────────────────────────────────────────────

    - name: Скопировать сертификаты в ca-certificates
      copy:
        remote_src: yes
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
      loop:
        - { src: "/etc/esp/esm/um/ca.crt",      dest: "/usr/local/share/ca-certificates/esm.crt" }
        - { src: "/etc/esp/esm/um/esp.crt",      dest: "/usr/local/share/ca-certificates/esp.crt" }
        - { src: "/etc/esp/esm/um/gismt.crt",    dest: "/usr/local/share/ca-certificates/gismt.crt" }
        - { src: "/etc/esp/lmcontroller/ca.crt", dest: "/usr/local/share/ca-certificates/esm-lm.crt" }
      register: certs_copied

    - name: Обновить хранилище сертификатов
      command: update-ca-certificates
      when: certs_copied.changed

    # ─────────────────────────────────────────────────────────────
    # БЛОК 6: Генерация ~esmmanager.ini
    # ─────────────────────────────────────────────────────────────

    - name: Сгенерировать и положить ~esmmanager.ini
      template:
        src: esmmanager.ini.j2
        dest: "{{ esm_conf_dest }}"
        owner: root
        group: root
        mode: '0644'

    # ─────────────────────────────────────────────────────────────
    # БЛОК 7: Перезапуск comproxy
    # ─────────────────────────────────────────────────────────────

    - name: Перезапустить сервис comproxy
      systemd:
        name: comproxy
        state: restarted
